<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-label="Profiles change the explanation; invariants keep the facts" font-size="13" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect width="760" height="640" fill="#ffffff"/><defs><marker id="fw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a949c"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1b2126">Profiles change the explanation; invariants keep the facts</text><g fill="none" stroke="#8a949c" stroke-width="1.25"><path d="M212 116V140" marker-end="url(#fw-arrow)"/><path d="M212 196V220" marker-end="url(#fw-arrow)"/><path d="M376 168H408" marker-end="url(#fw-arrow)"/><path d="M572 196V220" marker-end="url(#fw-arrow)"/><path d="M212 276V316" marker-end="url(#fw-arrow)"/><path d="M572 276V316" marker-end="url(#fw-arrow)"/><path d="M392 372V396" marker-end="url(#fw-arrow)"/><path d="M392 452V476" marker-end="url(#fw-arrow)"/><path d="M392 532V556" marker-end="url(#fw-arrow)"/><path d="M48 584H28V168H48" marker-end="url(#fw-arrow)"/></g><text x="20" y="372" transform="rotate(-90 20 372)" text-anchor="middle" font-size="11.5" fill="#5b6670">revise requirements</text><rect x="48" y="60" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="84" font-weight="600" fill="#1b2126">Cognitive accessibility requirements</text><text x="64" y="104" font-size="11.5" fill="#5b6670">128-guideline catalog + targeted search</text><rect x="48" y="140" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="164" font-weight="600" fill="#1b2126">XAI-relevant requirements</text><text x="64" y="184" font-size="11.5" fill="#5b6670">50 guidelines classed B or C (Task 1)</text><rect x="408" y="140" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="424" y="164" font-weight="600" fill="#1b2126">Capability dependencies</text><text x="424" y="184" font-size="11.5" fill="#5b6670">e.g. what changed needs stored forecasts</text><rect x="48" y="220" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="244" font-weight="600" fill="#1b2126">User-chosen explanation profile</text><text x="64" y="264" font-size="11.5" fill="#5b6670">goal, detail, likelihood form (Task 3)</text><rect x="408" y="220" width="328" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="424" y="244" font-weight="600" fill="#1b2126">ML prediction and evidence</text><text x="424" y="264" font-size="11.5" fill="#5b6670">category, likelihood, river forecast (Task 2)</text><rect x="48" y="316" width="688" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="340" font-weight="600" fill="#1b2126">Requirements-driven explanation adaptation</text><text x="64" y="360" font-size="11.5" fill="#5b6670">Profile rules choose content, order, form and depth; the prediction itself never changes</text><rect x="48" y="396" width="688" height="56" rx="8" fill="#1f5f7a" fill-opacity="0.12" stroke="#1f5f7a" stroke-width="2"/><text x="64" y="420" font-weight="600" fill="#1b2126">Fidelity invariants check</text><text x="64" y="440" font-size="11.5" fill="#1b2126">Hazard, place, time window, likelihood and action must survive every profile</text><rect x="48" y="476" width="688" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="500" font-weight="600" fill="#1b2126">Adapted explanation and interaction</text><text x="64" y="520" font-size="11.5" fill="#5b6670">e.g. Flooding is possible here on Thursday, with Why? and How sure? on request (Task 4)</text><rect x="48" y="556" width="688" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a949c" stroke-width="1.25"/><text x="64" y="580" font-weight="600" fill="#1b2126">Verification and validation</text><text x="64" y="600" font-size="11.5" fill="#5b6670">Now: requirement and invariant checks. Later: studies with people with cognitive impairments</text></svg>